# Static Yekola site on McBuleli VPS principal 162.35.181.98
# Root: /opt/yekola/public

server {
  listen 80;
  listen [::]:80;
  server_name yekola.mcbuleli.com;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://yekola.mcbuleli.com$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name yekola.mcbuleli.com;

  ssl_certificate /etc/letsencrypt/live/yekola.mcbuleli.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yekola.mcbuleli.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  root /opt/yekola/public;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
