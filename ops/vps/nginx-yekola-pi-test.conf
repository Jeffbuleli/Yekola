# Pi Testnet — pi-test.mcbuleli.com (hackathon / Staging)

upstream yekola_pi_test {
  server 127.0.0.1:3016;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;
  server_name pi-test.mcbuleli.com;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://pi-test.mcbuleli.com$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name pi-test.mcbuleli.com;

  ssl_certificate /etc/letsencrypt/live/pi-test.mcbuleli.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pi-test.mcbuleli.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 20m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location / {
    proxy_pass http://yekola_pi_test;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_read_timeout 120s;
  }
}